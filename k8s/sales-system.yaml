
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-v1
  template:
    metadata:
      labels:
        app: sales-v1
    spec:
      containers:
        - name: sales
          image: DOCKERHUB_USERNAME/sales-system:v1
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sales-v1
spec:
  type: ClusterIP
  selector:
    app: sales-v1
  ports:
    - port: 5000
      targetPort: 5000
---
